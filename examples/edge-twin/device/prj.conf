CONFIG_PRINTK=y
# mean_q / var_q cross the boundary as int64_t (the canonical value ABI is
# 64-bit), so `%lld` has to work or the audit log would print garbage that
# happened to look like numbers.
CONFIG_PICOLIBC_IO_LONG_LONG=y
# The kernel allocates nothing and does not recurse, so the default main stack
# is plenty; it is raised only because the log loop keeps a handful of 64-bit
# locals live and 1 KB is uncomfortably tight on RV32.
CONFIG_MAIN_STACK_SIZE=4096
