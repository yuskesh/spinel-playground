# tools/zephyr-full/host/prj.conf -- Zephyr's C library, POSIX layer and
# IPv4 networking for a hosted Spinel program (decision 0038)
CONFIG_PICOLIBC=y
# picolibc's printf writes floating point only with this; the runtime rounds
# Float#round(n) for large n through snprintf("%.*f")
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
# the runtime registers hooks with __attribute__((constructor))
CONFIG_STATIC_INIT_GNU=y
CONFIG_MAIN_STACK_SIZE=32768
# malloc's arena takes the RAM nothing else uses
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1
CONFIG_POSIX_API=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
# Zephyr does not start DHCP by itself; src/host.c calls net_dhcpv4_start
CONFIG_NET_DHCPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_DNS_RESOLVER=y
CONFIG_ENTROPY_GENERATOR=y
