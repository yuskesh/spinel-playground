# The probe: the M33 alone (the M7 is not released), the NETC switch's
# user port swp0, IPv4 by DHCP, UDP through sockets.
CONFIG_SECOND_CORE_MCUX=n
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_NET_LOG=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=y
CONFIG_NET_ARP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DSA=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_IF_MAX_IPV4_COUNT=4
CONFIG_NET_MAX_CONTEXTS=4
# one 1289-byte message is one Ethernet frame of 1331 bytes: the driver's
# transmit buffer must hold 1518, where its default is 1000
CONFIG_ETH_NXP_IMX_TX_RING_BUF_SIZE=1518
# a packet in one buffer: fixed 1536-byte data buffers, few of them, for the
# DTCM's 128 KB
CONFIG_NET_BUF_FIXED_DATA_SIZE=y
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=8

# THE RANDOM SOURCE. The network stack needs sys_rand_get for a DHCP
# transaction id and an ephemeral port, and the switch driver links a random
# MAC it does not use here (the overlay gives every port its address). The
# RT118x has no entropy driver wired up at the pinned Zephyr (0014's
# 2026-10-22 clarification). This measurement image takes Zephyr's
# non-random generator: a DHCP transaction id only has to differ from other
# clients' on this LAN for one exchange, and the socket binds a fixed source
# port. Not for a deliverable image.
CONFIG_TEST_RANDOM_GENERATOR=y

# the CPU's share, from the idle thread's cycles
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_MAIN_STACK_SIZE=4096
