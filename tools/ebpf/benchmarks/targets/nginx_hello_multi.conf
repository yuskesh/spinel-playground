# benchmarks/targets/nginx_hello_multi.conf
#
# 4-worker variant of nginx_hello.conf for M003 fair comparison.
# Same minimal "hello\n" response, but worker_processes 4 + SO_REUSEPORT
# matching the spinel M003 server's configuration.

user root;
worker_processes 4;
daemon on;
error_log /tmp/nginx_error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 0;

    server {
        # `reuseport` opts the listener into SO_REUSEPORT (1 listener per worker).
        listen 127.0.0.1:8080 default_server backlog=1024 reuseport;
        server_name _;

        location / {
            return 200 "hello\n";
            add_header Content-Type "text/plain";
        }
        location = /health {
            return 200 "OK\n";
            add_header Content-Type "text/plain";
        }
    }
}
