# benchmarks/targets/nginx_hello.conf
#
# Minimal nginx config for the M001 baseline. Serves a constant "hello\n"
# on 127.0.0.1:8080 with as little overhead as possible (no logging, no
# sendfile setup beyond defaults). Mirrors what the spinel-ebpf HTTP server
# will do at M001 (single 200 response, fixed body) so the comparison stays
# apples-to-apples.

# Run as root inside the build container, single worker so M001 baseline is
# 1-to-1 with the spinel single-process server. SO_REUSEPORT comparison comes
# later at M003.
user root;
worker_processes 1;
daemon on;
error_log /tmp/nginx_error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 0;   # M001 also has no keepalive — keep parity

    server {
        listen 127.0.0.1:8080 default_server backlog=1024;
        server_name _;

        location / {
            return 200 "hello\n";
            add_header Content-Type "text/plain";
        }

        location = /health {
            return 200 "OK\n";
            add_header Content-Type "text/plain";
        }
    }
}
