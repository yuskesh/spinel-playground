# The launcher releases the Cortex-M7 (soc/nxp/imxrt/imxrt118x/soc.c:
# Prepare_CM7 in the reset hook, second_core_boot at PRE_KERNEL_2), whose
# code runs in place from the NOR. LPUART1 is the M7's console, so the
# launcher has none.
CONFIG_SECOND_CORE_MCUX=y
CONFIG_CM7_BOOT_FROM_FLASH=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_PRINTK=n
CONFIG_GPIO=n
