# The network firmware, on top of prj.conf (tools/app/launcher): the NETC
# switch's user port, IPv4 by DHCP, UDP through sockets, the network code in
# the ITCM, as tools/doom/net-probe measured it. Still no console: LPUART1 is
# the M7's; the lane reads this image's counts with the debugger.
# the NETC pins (prj.conf has no driver that would pull pinctrl in)
CONFIG_PINCTRL=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=y
CONFIG_NET_ARP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DSA=y
CONFIG_NET_IF_MAX_IPV4_COUNT=4
CONFIG_NET_MAX_CONTEXTS=4
# one 1292-byte message is one Ethernet frame of 1334 bytes: the driver's
# transmit buffer must hold 1518, where its default is 1000
CONFIG_ETH_NXP_IMX_TX_RING_BUF_SIZE=1518
CONFIG_NET_BUF_FIXED_DATA_SIZE=y
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_CODE_DATA_RELOCATION=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
# THE RANDOM SOURCE. The network stack calls sys_rand_get for the DHCP
# transaction id, and links the switch driver's random MAC, which is never
# made (the overlay gives every port its address); the socket binds a fixed
# source port, so no ephemeral port is asked for; the boot id does not use
# it. The RT118x has no entropy driver wired up at the pinned Zephyr (0014's
# clarification of 2026-10-22), so this takes Zephyr's non-random
# generator, whose numbers are not random: a DHCP transaction id only has to
# differ from other clients' on the LAN for one exchange. A true random
# source is still open.
CONFIG_TEST_RANDOM_GENERATOR=y
