# the reserve harness's own needs, and the production fragment's symbols, so
# the image is the one whose interrupt-stack mark is in question
CONFIG_PRINTK=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_USAGE=y
CONFIG_CORTEX_M_SYSTICK_64BIT_CYCLE_COUNTER=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_PWM=y
# slicing off in both modes: it is the 24 bytes already accounted for
CONFIG_TIMESLICING=n
