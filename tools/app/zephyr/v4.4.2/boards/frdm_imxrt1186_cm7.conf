# The M7 application of decision 0023: the second core, released by the
# launcher, its code in place in the NOR; the console transport's transmit
# interrupt-driven (transport_uart.c.erb), so a frame goes out while the
# scheduler runs.
CONFIG_SECOND_CORE_MCUX=y
CONFIG_CM7_BOOT_FROM_FLASH=y
CONFIG_UART_INTERRUPT_DRIVEN=y
