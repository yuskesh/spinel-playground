# The M33 companion of decision 0027: it releases the M7 (soc/nxp/imxrt/imxrt118x/soc.c:
# Prepare_CM7 in the reset hook, second_core_boot at PRE_KERNEL_2), whose code
# runs in place from the NOR, as tools/app/launcher does. Its console is the
# board's unless the build adds frdm_imxrt1186_cm33_amp_no_console.conf.
CONFIG_SECOND_CORE_MCUX=y
CONFIG_CM7_BOOT_FROM_FLASH=y
