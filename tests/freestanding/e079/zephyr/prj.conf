CONFIG_PRINTK=y
# The canonical value ABI is 64-bit (P003 D-1), so %lld has to work in the
# trap hook's diagnostic.
CONFIG_PICOLIBC_IO_LONG_LONG=y
# NOTE what is NOT here: CONFIG_PICOLIBC_IO_FLOAT / CONFIG_CBPRINTF_FP_SUPPORT.
# E077 needed them because it printed doubles as decimal; E079 prints the 16
# hex digits of the bit pattern instead (drv/e079_drv.c explains why), so the
# device never formats a float.  That also means the four-way comparison
# cannot be quietly weakened by three different printf implementations.
# And `libm: none` stays true on both sides of the boundary.
CONFIG_MAIN_STACK_SIZE=8192
