# E083: the shipped riscv32-zephyr.yaml plus the adjoint as a platform extern
# with buffer parameters.  See cortex-m33-zephyr-e083.yaml for the reasoning;
# the extern surface is spelled identically so one kernel object surface exists
# across all four legs of the differential.
target:
  triple: riscv32-none-elf
  cpu:
  data_layout: "e-m:e-p:32:32-i64:64-n32-S128"
  cflags:
    - -march=rv32imac_zicsr_zifencei
    - -mabi=ilp32
    - -Os

abi:
  boundary: c-abi
  int_width: i32-internal
  overflow: trap
  trap_hook: spinel_trap

runtime:
  libc: none
  libm: none
  compiler_rt: allow

platform:
  type: zephyr
  externs:
    - spinel_trap
    - name: grad_loss
      symbol: spinel_grad_sq_hinge_loss
      params: [[f64_buf, in], len, [f64_buf, in], [f64_buf, out], len]
      returns: f64
