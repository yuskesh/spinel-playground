CONFIG_PRINTK=y
# The canonical value ABI is 64-bit, so `%lld` has to work.
CONFIG_PICOLIBC_IO_LONG_LONG=y
# E077: the boundary now carries doubles, so snprintf has to render them.
# Note what this does NOT pull in: libm.  Formatting a double and computing
# with one are different capabilities, and the profile still says `libm: none`
# -- the undefined-symbol gate on kern.o is what keeps that true (the gate runs
# on the generated object, before Zephyr's own libc is anywhere near it).
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
# The default trap hook longjmps back into the driver so that all cases -- the
# ones that trap included -- run in one image.  See src/main.c.
CONFIG_MAIN_STACK_SIZE=8192
