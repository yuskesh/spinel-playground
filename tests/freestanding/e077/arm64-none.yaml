# E077: a 64-bit-pointer profile, for the ABI matrix only.
#
# It is NOT a deployment profile and deliberately does not live in
# tools/freestanding/profiles/: nothing runs a freestanding kernel on macOS
# arm64, and P003's layer 1 is about targets people ship to.  It exists because
# all three shipped profiles are 32-bit (thumbv8m / riscv32 / wasm32), so a
# POINTER boundary tested only on them would never have seen a pointer whose
# width differs from an i32 -- which is precisely the place a pointer boundary
# can be wrong.  Adding a row to abi.tsv is cheaper than arguing that 32 bits
# generalise.
#
# `platform: none` and `libc: none` are the honest values: there is no platform
# here at all, and the object is never linked.
target:
  triple: arm64-apple-macosx14.0.0
  data_layout: "e-m:o-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-n32:64-S128-Fn32"
  cflags: [-O2]
abi:
  boundary: c-abi
  int_width: i64-internal
  overflow: trap
  trap_hook: spinel_trap
runtime:
  libc: none
  libm: none
  compiler_rt: allow
platform:
  type: none
  # Mach-O prefixes every C symbol with `_`; as in e079/arm64-host.yaml the
  # profile names both spellings rather than teaching the gate a mangling.
  externs: [spinel_trap, _spinel_trap]
