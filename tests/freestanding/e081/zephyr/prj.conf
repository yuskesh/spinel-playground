CONFIG_PRINTK=y
# The canonical value ABI is 64-bit, so `%lld` has to work.
CONFIG_PICOLIBC_IO_LONG_LONG=y
# fsense rows print a double via snprintf %.17g.
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
# The harness trap hook longjmps back into the driver (E040/E077 shape).
CONFIG_MAIN_STACK_SIZE=8192
# E081: the gpio_set/gpio_get wrappers drive the real GPIO driver where the
# board's devicetree has one (mps2/an521's FPGAIO LED register); on a board
# without one (qemu_riscv32) the wrapper falls back to its shadow array and
# says so in the log.
CONFIG_GPIO=y
