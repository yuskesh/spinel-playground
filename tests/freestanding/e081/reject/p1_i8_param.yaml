target:
  triple: thumbv8m.main-none-eabi
  cpu: cortex-m33
  data_layout: "e-m:e-p:32:32-Fi8-i64:64-v128:64:128-a:0:32-n32-S64"
  cflags: [-mcpu=cortex-m33+nodsp, -mfloat-abi=soft, -Os]
abi: {boundary: c-abi, int_width: i32-internal, overflow: trap, trap_hook: spinel_trap}
runtime: {libc: none, libm: none, compiler_rt: allow}
platform:
  type: zephyr
  externs:
    - {name: peek, params: [i8], returns: i32}
