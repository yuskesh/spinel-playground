# E084: the E083 profile plus a SECOND callable platform extern -- the
# forward-over-reverse Hessian-vector product spinel-gradfs synthesises for
# `sq_hinge_loss` when its `freestanding_grad_def` says `hvp: true` (draft
# G9-fs; the spelling of the DECLARATION is D-10, confirmed, unchanged).
#
# The hvp signature keeps E077's run rule: dir/g/hv are inserted after the
# wrt buffer `w`, INSIDE the run one `len` (nw) governs -- exactly where the
# grad declaration put its shadow.  The declaration below IS the C signature
# spinel-gradfs emits for the hvp shim:
#
#   double spinel_hvp_sq_hinge_loss(const double *data, int32_t nd,
#                                   const double *w, const double *dir_w,
#                                   double *g_w, double *hv_w, int32_t nw);
#
# (g_w receives the gradient, hv_w its tangent = H.v, the return value is
# grad f . dir -- E082's spg_hvp_* contract, at the freestanding boundary.)
#
# NOT a shipped profile.  Same standing as E083's *-e083.yaml.

target:
  triple: arm64-apple-macosx14.0.0
  data_layout: "e-m:o-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-n32:64-S128-Fn32"
  cflags:
    - -O2
abi:
  boundary: c-abi
  int_width: i64-internal
  overflow: trap
  trap_hook: spinel_trap
runtime:
  libc: none
  libm: none
  compiler_rt: allow
platform:
  type: none
  externs:
    - spinel_trap
    - _spinel_trap
    # Mach-O prefixes C identifiers with `_` and undef-check compares raw
    # strings (E079 Honest boundary) -- the host-only profile carries the
    # second spelling of the adjoint symbol for the same reason it carries
    # _spinel_trap.
    - _spinel_grad_sq_hinge_loss
    - _spinel_hvp_sq_hinge_loss
    - name: grad_loss
      symbol: spinel_grad_sq_hinge_loss
      params: [[f64_buf, in], len, [f64_buf, in], [f64_buf, out], len]
      returns: f64
    - name: hvp_loss
      symbol: spinel_hvp_sq_hinge_loss
      params: [[f64_buf, in], len, [f64_buf, in], [f64_buf, in], [f64_buf, out], [f64_buf, out], len]
      returns: f64
