CONFIG_PRINTK=y
# The canonical value ABI is 64-bit (P003 D-1), so %lld has to work in the
# trap hook's diagnostic.
CONFIG_PICOLIBC_IO_LONG_LONG=y
# As in E079/E083: no CONFIG_PICOLIBC_IO_FLOAT / CONFIG_CBPRINTF_FP_SUPPORT --
# the device prints IEEE bit patterns, never a decimal float, so the four-way
# comparison cannot be weakened by printf implementations, and `libm: none`
# stays true on both sides of the boundary.
#
# 16K, not E083's 8K: the hvp shim keeps a VLA shadow of the data buffer
# (64 rows x 5 doubles = 2560 B) on the stack, under the Newton-CG kernel
# frame.  MEASURED: the whole stream also completes bit-identically at 8K
# (probe build -DCONFIG_MAIN_STACK_SIZE=8192, E084 session); 16K is chosen
# headroom for the VLA, whose size scales with the data buffer.
CONFIG_MAIN_STACK_SIZE=16384
