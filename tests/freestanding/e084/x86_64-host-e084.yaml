# E084's host leg on x86-64 Linux: arm64-host-e084.yaml with this host's triple
# and the data layout clang emits for it. ELF does not prefix C names, so each
# symbol needs one spelling. Not a deployment profile.
target:
  triple: x86_64-unknown-linux-gnu
  data_layout: "e-m:e-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-f80:128-n8:16:32:64-S128"
  cflags:
    - -O2
abi:
  boundary: c-abi
  int_width: i64-internal
  overflow: trap
  trap_hook: spinel_trap
runtime:
  libc: none
  libm: none
  compiler_rt: allow
platform:
  type: none
  externs:
    - spinel_trap
    - name: grad_loss
      symbol: spinel_grad_sq_hinge_loss
      params: [[f64_buf, in], len, [f64_buf, in], [f64_buf, out], len]
      returns: f64
    - name: hvp_loss
      symbol: spinel_hvp_sq_hinge_loss
      params: [[f64_buf, in], len, [f64_buf, in], [f64_buf, in], [f64_buf, out], [f64_buf, out], len]
      returns: f64
