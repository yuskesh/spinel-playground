# The probe reads k_cycle_get_64() inside a k_timer expiry. On mps2/an521 the
# system timer is SysTick at 25 MHz, below the 60 MHz at which Zephyr enables
# the 64-bit software count by default, so it is enabled here explicitly.
CONFIG_CORTEX_M_SYSTICK_64BIT_CYCLE_COUNTER=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_ADC=y
CONFIG_ADC_EMUL=y
